# cargo-deny 配置文件（P2-36: R8-CONF-009）
#
# 用途：
#   供 CI（.github/workflows/security.yml 的 cargo-deny job）执行依赖合规审查。
#   命令：cargo deny check advisories licenses bans sources
#
# 设计原则：
#   - 允许常见的宽松开源许可证（MIT / Apache-2.0 / BSD / ISC / Zlib 等）
#   - 检测 RustSec 已知漏洞（advisories），yanked 版本仅告警避免误杀
#   - 重复依赖仅告警（bans），不阻断 CI
#   - 限制依赖来源（sources）
#   - 仅采用 cargo-deny 长期稳定字段，保证跨版本可解析

[advisories]
# yanked 版本仅告警（传递依赖可能存在 yanked，告警不阻断 CI）
yanked = "warn"
# 忽略的漏洞 ID（记录式豁免：每条须附理由与复评条件，随依赖升级定期复核）
ignore = [
    # rsa 0.9.10（最新 stable）无补丁：Marvin Attack 时序侧信道（上游 patched=[] 是有意的，
    # 跟踪 RustCrypto/RSA#626）。本仓经 jsonwebtoken（JWT RS256）引入。
    # 批六十二攻击面定性：全仓 rsa 使用点仅 sso_service.rs 的 RS256 签名 + JWKS
    # 公钥分发，零 decrypt 调用（grep 实证）——Marvin Attack 针对解密 padding-oracle
    # 时序场景，签名路径不受影响，攻击面不适用。跟踪 RSA#626，上游 constant-time
    # 实现落地后立即解除本豁免并升级。
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack 无上游补丁；本仓仅 RS256 签名无解密（攻击面不适用），跟踪 RSA#626" },
    # atomic-polyfill 1.0.3 unmaintained：phonenumber(build)→postcard→heapless 传递引入，
    # 仅构建期数据序列化使用、无运行时安全面；上游无替代升级路径（heapless 0.7 锁定），
    # heapless/postcard 大版本升级时复核。
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained（phonenumber 构建期传递引入），随 heapless 升级复核" },
]

[licenses]
# 允许的许可证白名单；不在白名单内即报 error
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    # bzip2-1.0.6：libbz2-rs-sys（rust_xlsxwriter xlsx 压缩链），bzip2 原始许可，宽松可分发
    "bzip2-1.0.6",
    # CDLA-Permissive-2.0：webpki-roots/webpki-root-certs（rustls 证书根数据集），宽松数据许可
    "CDLA-Permissive-2.0",
]
# 许可证识别置信度阈值（0.0~1.0）
confidence-threshold = 0.8

[bans]
# 重复依赖版本仅告警，不阻断 CI
multiple-versions = "warn"
# 通配符依赖仅告警
wildcards = "warn"

[sources]
# 未知 registry / git 来源仅告警（避免私有源 / git 依赖导致误杀）
unknown-registry = "warn"
unknown-git = "warn"
# 允许的官方 registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
