# Stepby Axum Security Scan（单仓版）
#
# 作用：
#   1. cargo-audit  —— Rust 依赖已知 CVE（RustSec advisory-db）
#   2. cargo-deny   —— advisory / license / ban / source 合规审查（deny.toml）
#   3. gitleaks     —— 全仓库密钥/凭证泄露扫描
#
# 触发：push/PR 到 main、每周一 03:00 UTC 定时全量扫描。
# 权限：contents: read 最小权限；三个 job 并行互不阻断。

name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust 依赖漏洞扫描 (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  cargo-deny:
    name: Rust 依赖合规审查 (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check advisories licenses bans sources

  gitleaks:
    name: 密钥泄露扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 直装官方 CLI（gitleaks/gitleaks 非 action 仓、gitleaks-action 对 org 仓收费——
      # run 38284804232/38278563759 实证），版本钉死保证可复现
      - name: Install gitleaks (official binary, pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (full history secret scan)
        run: gitleaks detect --source . --redact -v --exit-code 1
