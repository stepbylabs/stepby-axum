# Stepby Axum Security Scan（单仓版）
#
# 作用：
#   1. cargo-audit  —— Rust 依赖已知 CVE（RustSec advisory-db）
#   2. cargo-deny   —— advisory / license / ban / source 合规审查（deny.toml）
#   3. gitleaks     —— 全仓库密钥/凭证泄露扫描
#
# 触发：push/PR 到 main、每周一 03:00 UTC 定时全量扫描。
# 权限：contents: read 最小权限；三个 job 并行互不阻断。

name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust 依赖漏洞扫描 (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit

  cargo-deny:
    name: Rust 依赖合规审查 (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check advisories licenses bans sources

  gitleaks:
    name: 密钥泄露扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # zricethezdev/gitleaks-action 已迁移至 gitleaks org（旧仓库 404，run 38275497480 实证）
        uses: gitleaks/gitleaks@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
