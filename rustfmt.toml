# rustfmt 配置（P2-15）
# 项目使用 Rust 1.96.0 + edition 2024，配置锁定代码风格
#
# 2026-09-26 修订：移除 4 个 **nightly 专属**选项（`group_imports` / `wrap_comments` /
# `normalize_comments` / `condense_wildcard_suffixes`）。理由：`rust-toolchain.toml` 钉的是
# `channel = "stable"`，stable rustfmt 会**静默忽略**这些选项并在每次运行时打印 Warning，
# 导致 `cargo fmt --check` 恒有大量差异（实测 stable 110 文件 / 269 处），CI Backend job
# 的 `Format check: cargo fmt -- --check` 步骤因此失败。改用 stable 可复现配置后，
# 任何机器（含 CI 的 stable toolchain）都能得到一致的格式化结果。
# 另：`fn_args_layout` 已废弃（rustfmt 1.9 提示），更名 `fn_params_layout`。

# 基础配置
edition = "2024"
max_width = 100

# 导入排序（stable 特性）
reorder_imports = true

# 结构体和枚举
use_field_init_shorthand = true

# 控制流
fn_params_layout = "Tall"