# axum-backend/governance/Cargo.toml
#
# 治理项注册表（单一事实源），由 `axum-backend`（lib）与 `migration` 共同依赖。
# 之所以独立成 crate：migration crate 无法依赖 lib（会形成循环/重量级依赖），
# 此前只能靠"同值本地副本 + 人工两处同步"维持，属结构性漂移风险。
#
# **刻意零依赖**：本 crate 只含 `&'static` 数据与纯函数，不引入任何第三方依赖，
# 以保证两个使用方都能以最低成本共同依赖它。

[package]
name = "governance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
