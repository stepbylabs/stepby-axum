# axum-backend 生产环境编排（R6-BE-ENG-19）
#
# 用途：
#   生产环境部署编排，包含后端应用服务 + PostgreSQL + Redis。
#   使用生产 Dockerfile（多阶段构建、release 优化、非 root 用户）。
#
# 部署方式：
#   1. 准备环境变量（敏感字段从环境变量注入，不要写入文件）：
#      export DATABASE_URL=postgres://user:strong_pass@postgres:5432/yebot
#      export REDIS_URL=redis://redis:6379/0
#      export JWT_SECRET=<至少 32 字符的强随机密钥>
#      export JWT_EXPIRE_HOURS=6
#
#   2. 启动：
#      docker compose -f docker-compose.prod.yml up -d
#
#   3. 查看日志：
#      docker compose -f docker-compose.prod.yml logs -f app
#
#   4. 升级（拉取新镜像后滚动重启）：
#      docker compose -f docker-compose.prod.yml up -d --no-deps --build app
#
#   5. 停止：
#      docker compose -f docker-compose.prod.yml down
#
# 安全说明：
# - 默认仅暴露 app 服务的 8080 端口到宿主机，数据库端口不对外暴露
# - 数据库密码 / JWT 密钥必须从环境变量注入，本文件中仅为占位符
# - 建议在反向代理（Nginx/Caddy）层配置 TLS 终止和 rate limiting

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yebot-backend:prod
    container_name: yebot-backend-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      # 必填：从环境变量注入，未设置时容器无法启动（fail-fast，避免 CHANGE_ME 占位值偷偷连接）
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set, e.g. postgres://user:pass@host:5432/db}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set, e.g. redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong secret >= 32 chars}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-6}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yebot_prod_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # 资源限制（按需调整，避免单容器耗尽宿主资源）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:17-alpine
    container_name: yebot-postgres-prod
    restart: always
    environment:
      # 生产环境密码必须从环境变量注入
      POSTGRES_USER: ${POSTGRES_USER:-yebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-yebot}
      TZ: Asia/Shanghai
    # 生产环境数据库端口不对外暴露，仅通过 compose 网络访问
    expose:
      - "5432"
    volumes:
      - yebot_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yebot} -d ${POSTGRES_DB:-yebot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yebot_prod_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: yebot-redis-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
    expose:
      - "6379"
    # 持久化：AOF + RDB 双重保障，防止重启丢失 token 黑名单/限流计数
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - yebot_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yebot_prod_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  yebot_prod_pg_data:
  yebot_prod_redis_data:

networks:
  yebot_prod_net:
    driver: bridge
